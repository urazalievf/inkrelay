name: InkRelayMobile
options:
  bundleIdPrefix: io.github.urazalievf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  InkRelay:
    path: ..
targets:
  InkRelayMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: InkRelay
        product: InkRelayCore
    settings:
      base:
        PRODUCT_NAME: InkRelay
        PRODUCT_BUNDLE_IDENTIFIER: io.github.urazalievf.InkRelay.mobile
        # iPhone and iPad apps carry MAJOR.MINOR.PATCH as the version; a bug-fix number goes in the build number.
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InkRelay
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_STYLE: Automatic
        # The Apple Developer team that signs device builds (not a secret; it's in every signed app).
        DEVELOPMENT_TEAM: DT9JP293AM
