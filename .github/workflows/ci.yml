name: CI

# Every change reaches main through a pull request, so CI runs on pull requests and on demand,
# not again on every push.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
